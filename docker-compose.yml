version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    # Беремо з backend/.env, а не хардкодимо.
    #
    # Раніше тут стояв пароль `2111` і база `prime_platform_db`, тоді як
    # backend читав свої значення з .env. Два джерела правди про одні й ті самі
    # облікові дані: варто помінятись одному — і backend не може підключитись
    # («password authentication failed» або «database does not exist»),
    # причому виглядає це як проблема мережі, а не конфігу.
    #
    # Плюс пароль лежав просто в git.
    # Образ postgres читає POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # просто зі свого оточення, тож `env_file` достатньо — окремий блок
    # `environment:` тут не потрібен.
    #
    # ВАЖЛИВО: `${...}` у compose підставляється з `.env` поруч із самим
    # docker-compose.yml, а НЕ з `env_file`. Тому написати
    # `POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}` і сподіватись, що значення
    # приїде з backend/.env, не вийде — підставиться порожній рядок.
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      # Мапимо папку з хоста в контейнер backend,
      # щоб backend міг перевіряти/генерувати сертифікати
      - ./certificates:/app/static/certificates
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "https://my-prime-academy.com"
        VITE_WS_URL: "wss://my-prime-academy.com"
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      # Та сама папка в Nginx, щоб він віддавав PDF людям
      - ./certificates:/var/www/certificates
    # nginx тримає сертифікат у памʼяті. certbot оновлює ФАЙЛ, але процес
    # про це не дізнається — і сайт віддає прострочений сертифікат, поки
    # хтось не перезапустить контейнер руками. Саме так він і прострочився
    # у вересні 2026.
    #
    # Фоновий цикл перечитує конфіг кожні 6 годин. `nginx -s reload` не рве
    # відкриті зʼєднання: старі воркери доживають свої запити, нові беруть
    # оновлений сертифікат.
    #
    # Альтернатива — прокинути certbot доступ до docker.sock, щоб він робив
    # `docker exec nginx -s reload`. Не робимо: сокет це фактично root
    # на хості, і віддавати його контейнеру заради одного reload — погана ціна.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # `--deploy-hook` спрацьовує ЛИШЕ коли сертифікат справді перевипущено.
    # Без нього в логах самі порожні прогони, і момент оновлення не знайти —
    # а саме він потрібен, коли розбираєшся, чому браузер лається.
    entrypoint: >
      sh -c "while :; do
            certbot renew --webroot -w /var/www/certbot --agree-tos --no-eff-email
            --deploy-hook 'echo \"[certbot] сертифікат оновлено $$(date -u +%FT%TZ)\"';
            sleep 12h;
            done"
    networks:
      - appnet
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  appnet:

volumes:
  postgres_data: