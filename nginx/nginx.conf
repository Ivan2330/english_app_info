events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server_tokens off;

    upstream backend {
        server backend:8000;
    }

    # HTTP -> HTTPS + webroot для Certbot
    server {
        listen 80;
        server_name my-prime-academy.com www.my-prime-academy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name my-prime-academy.com www.my-prime-academy.com;

        ssl_certificate     /etc/letsencrypt/live/my-prime-academy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/my-prime-academy.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # PDF сертифікати
        # Запит https://my-prime-academy.com/static/certificates/file.pdf
        # піде в папку /var/www/certificates
        location /static/certificates/ {
            alias /var/www/certificates/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона доступу до прихованих файлів/папок
        # Важливо: цей блок має бути ДО location /
        # ------------------------------------------------------------
        location ~ /\.(?!well-known).* {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона секретних JSON-файлів у корені
        # Бо SPA fallback інакше може віддати index.html зі статусом 200
        # ------------------------------------------------------------
        location ~* ^/(service-account|serviceAccount|service_account|serviceAccountKey|service-account-key|service-account-config|service-account-file|service-account-credentials|firebase|firebase-adminsdk|firebase-service-account|firebase-credentials|gcp|gcp-key|gcp-credentials|gcloud-service-key|google-services|credentials|client_secret|keyfile|key|application_default_credentials).*\.json$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона секретних JSON-файлів у config/secrets/auth
        # /api тут спеціально НЕ блокуємо повністю, щоб не зачепити API.
        # ------------------------------------------------------------
        location ~* ^/(config|secrets|auth)/.*(service-account|firebase|gcp|credentials|client_secret|key|secret).*\.json$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: конфіги, бекапи, ключі, env, npmrc, yarnrc
        # ------------------------------------------------------------
        location ~* \.(env|ini|log|bak|backup|old|orig|save|swp|sql|sqlite|db|pem|key|crt|yml|yaml|toml|npmrc|yarnrc)$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: конкретні системні файли
        # ------------------------------------------------------------
        location ~* ^/(\.npmrc|\.yarnrc|composer\.json|composer\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|docker-compose\.ya?ml)$ {
            deny all;
            return 403;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            try_files /favicon.ico =404;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
            try_files /robots.txt =404;
        }

        # API
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Port 443;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # SPA фронт React/Vite
        # Має бути ПІСЛЯ security-блоків, API і WS
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}