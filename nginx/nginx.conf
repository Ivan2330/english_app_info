events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server_tokens off;

    # Стиснення тексту: JS/CSS/JSON/SVG без gzip віддавались у 3–4 рази більшими.
    # HTML (text/html) стискається завжди. Зображення й шрифти woff2 вже стиснені,
    # їх у списку немає. Вмикаємо на рівні http, тож діє й на проксійований /api.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/manifest+json application/xml image/svg+xml;

    upstream backend {
        server backend:8000;
    }

    # HTTP -> HTTPS + webroot для Certbot
    server {
        listen 80;
        server_name my-prime-academy.com www.my-prime-academy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name my-prime-academy.com www.my-prime-academy.com;

        ssl_certificate     /etc/letsencrypt/live/my-prime-academy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/my-prime-academy.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # За замовчуванням nginx пускає тіло до 1 МБ — картинка з телефона
        # отримала б 413 ще до бекенда. 25 МБ: документи до 20 МБ + запас на multipart.
        client_max_body_size 25m;

        # PDF сертифікати
        # Запит https://my-prime-academy.com/static/certificates/file.pdf
        # піде в папку /var/www/certificates
        location /static/certificates/ {
            alias /var/www/certificates/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона доступу до прихованих файлів/папок
        # Важливо: цей блок має бути ДО location /
        # ------------------------------------------------------------
        location ~ /\.(?!well-known).* {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона секретних JSON-файлів у корені
        # Бо SPA fallback інакше може віддати index.html зі статусом 200
        # ------------------------------------------------------------
        location ~* ^/(service-account|serviceAccount|service_account|serviceAccountKey|service-account-key|service-account-config|service-account-file|service-account-credentials|firebase|firebase-adminsdk|firebase-service-account|firebase-credentials|gcp|gcp-key|gcp-credentials|gcloud-service-key|google-services|credentials|client_secret|keyfile|key|application_default_credentials).*\.json$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: заборона секретних JSON-файлів у config/secrets/auth
        # /api тут спеціально НЕ блокуємо повністю, щоб не зачепити API.
        # ------------------------------------------------------------
        location ~* ^/(config|secrets|auth)/.*(service-account|firebase|gcp|credentials|client_secret|key|secret).*\.json$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: конфіги, бекапи, ключі, env, npmrc, yarnrc
        # ------------------------------------------------------------
        location ~* \.(env|ini|log|bak|backup|old|orig|save|swp|sql|sqlite|db|pem|key|crt|yml|yaml|toml|npmrc|yarnrc)$ {
            deny all;
            return 403;
        }

        # ------------------------------------------------------------
        # SECURITY: конкретні системні файли
        # ------------------------------------------------------------
        location ~* ^/(\.npmrc|\.yarnrc|composer\.json|composer\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|docker-compose\.ya?ml)$ {
            deny all;
            return 403;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            try_files /favicon.ico =404;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
            try_files /robots.txt =404;
        }

        # Завантаження файлів у кабінет: відео до 300 МБ (UPLOAD_VIDEO_MAX_MB).
        # Буферизацію вимкнено, щоб великий файл не складався спершу на диск nginx,
        # а таймаут довший: 300 МБ з мобільного інтернету не влізуть у 5 хвилин.
        location = /api/admin/files {
            client_max_body_size 310m;
            proxy_request_buffering off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 60s;
            proxy_send_timeout    900s;
            proxy_read_timeout    900s;
        }

        # API
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Port 443;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Зібрані файли Vite (/assets/*): у назві хеш вмісту, тож змінений файл = нова адреса.
        # Кешуємо на рік і без перевірки. add_header у location скасовує server-рівневі,
        # тому заголовки безпеки повторено. ^~ — щоб картинки з /assets/ не перехопила
        # regex-локація нижче (там кеш лише 30 днів, бо імена в public/ без хешу).
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # Іконки, превʼю, логотипи з public/: імена без хешу, тому лише 30 днів.
        location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=2592000";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # SPA фронт React/Vite
        # Має бути ПІСЛЯ security-блоків, API і WS.
        # HTML (index.html і пререндерені /trial.html тощо) ніколи не кешуємо без перевірки:
        # після деплою людина одразу бачить нову збірку, бо в ній нові хеші /assets.
        #
        # $uri.html: /trial віддається файлом trial.html зі своїми SEO-тегами (див. scripts/prerender.mjs).
        # Саме .html, а не директорія з index.html: для директорії nginx робить 301 на /trial/,
        # а canonical у нас без слеша.
        location / {
            # /trial/ → /trial: одна адреса на сторінку (збігається з canonical)
            rewrite ^/(.+)/$ /$1 permanent;
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri.html /index.html;
        }
    }
}